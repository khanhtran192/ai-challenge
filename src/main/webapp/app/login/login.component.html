<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header class="login-header">
      <mat-card-title class="login-title" data-cy="loginTitle" jhiTranslate="login.title">Đăng nhập</mat-card-title>
    </mat-card-header>

    <mat-card-content class="login-content">
      @if (authenticationError()) {
        <mat-error class="login-error" data-cy="loginError">
          <mat-icon>error</mat-icon>
          <span jhiTranslate="login.messages.error.authentication">
            <strong>Đăng nhập thất bại!</strong> Bạn vui lòng kiểm tra thông tin đăng nhập và thử lại.
          </span>
        </mat-error>
      }

      <form class="login-form" (ngSubmit)="login()" [formGroup]="loginForm">
        <mat-form-field class="login-field" appearance="outline">
          <mat-label jhiTranslate="global.form.username.label">Tên tài khoản</mat-label>
          <input
            matInput
            type="text"
            name="username"
            #username
            placeholder="{{ 'global.form.username.placeholder' | translate }}"
            formControlName="username"
            data-cy="username"
            required
          />
          <mat-error *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched">
            Tên tài khoản là bắt buộc
          </mat-error>
        </mat-form-field>

        <mat-form-field class="login-field" appearance="outline">
          <mat-label jhiTranslate="login.form.password">Mật khẩu</mat-label>
          <input
            matInput
            type="password"
            name="password"
            placeholder="{{ 'login.form.password.placeholder' | translate }}"
            formControlName="password"
            data-cy="password"
            required
          />
          <mat-error *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"> Mật khẩu là bắt buộc </mat-error>
        </mat-form-field>

        <mat-checkbox class="login-checkbox" formControlName="rememberMe" name="rememberMe" id="rememberMe">
          <span jhiTranslate="login.form.rememberme">Nhớ tài khoản</span>
        </mat-checkbox>

        <button
          mat-raised-button
          color="primary"
          type="submit"
          class="login-button"
          data-cy="submit"
          [disabled]="loginForm.invalid"
          jhiTranslate="login.form.button"
        >
          Đăng nhập
        </button>
      </form>
    </mat-card-content>

    <mat-card-actions class="login-actions">
      <div class="login-links">
        <a
          mat-button
          color="primary"
          routerLink="/account/reset/request"
          data-cy="forgetYourPasswordSelector"
          jhiTranslate="login.password.forgot"
          class="forgot-password-link"
        >
          Bạn quên mật khẩu?
        </a>

        <div class="register-section">
          <span class="register-text" jhiTranslate="global.messages.info.register.noaccount">Bạn vẫn chưa có tài khoản?</span>
          <a
            mat-button
            color="accent"
            routerLink="/account/register"
            jhiTranslate="global.messages.info.register.link"
            class="register-link"
          >
            Đăng ký tài khoản mới
          </a>
        </div>
      </div>
    </mat-card-actions>
  </mat-card>
</div>
